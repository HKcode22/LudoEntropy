<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Stars Clone</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="positioning_fix.css">
</head>
<body>
    <div id="app">
        <div id="menu-screen" class="screen active">
            <div class="menu-container">
                <h1 class="game-title">LUDO</h1>
                <div class="menu-form">
                    <input id="playerNameInput" class="menu-input" type="text" maxlength="16" placeholder="Your name (e.g., Gooner Sahab)">
                    <div class="menu-color-row">
                        <label class="menu-label" for="playerColorSelect">Your color</label>
                        <select id="playerColorSelect" class="menu-select">
                            <option value="blue" selected>Blue</option>
                            <option value="red">Red</option>
                            <option value="green">Green</option>
                            <option value="yellow">Yellow</option>
                        </select>
                    </div>
                </div>
                <div class="menu-buttons">
                    <button class="menu-btn quick-play-btn" id="quickPlayBtn">
                        <span class="btn-icon">⚡</span>
                        <span class="btn-text">Quick Play</span>
                    </button>
                    <button class="menu-btn create-btn" id="createGameBtn">
                        <span class="btn-icon">+</span>
                        <span class="btn-text">Create Game</span>
                    </button>
                    <button class="menu-btn join-btn" id="joinGameBtn">
                        <span class="btn-icon">→</span>
                        <span class="btn-text">Join Game</span>
                    </button>
                </div>
            </div>
        </div>

        <div id="lobby-screen" class="screen">
            <div class="lobby-container">
                <h2 class="lobby-title">Game Lobby</h2>
                <div class="room-code-display">
                    <span class="room-label">Room Code:</span>
                    <span class="room-code" id="roomCode"></span>
                    <button class="copy-btn" id="copyCodeBtn">Copy</button>
                </div>
                <div class="players-grid">
                    <div class="player-slot" data-color="red">
                        <div class="player-avatar red-avatar"></div>
                        <div class="player-status">Waiting...</div>
                    </div>
                    <div class="player-slot" data-color="green">
                        <div class="player-avatar green-avatar"></div>
                        <div class="player-status">Waiting...</div>
                    </div>
                    <div class="player-slot" data-color="yellow">
                        <div class="player-avatar yellow-avatar"></div>
                        <div class="player-status">Waiting...</div>
                    </div>
                    <div class="player-slot" data-color="blue">
                        <div class="player-avatar blue-avatar"></div>
                        <div class="player-status">Waiting...</div>
                    </div>
                </div>
                <button class="start-game-btn" id="startGameBtn" disabled>Start Game</button>
                <button class="back-btn" id="backToMenuBtn">Back to Menu</button>
            </div>
        </div>

        <div id="join-screen" class="screen">
            <div class="join-container">
                <h2 class="join-title">Join Game</h2>
                <input type="text" id="roomCodeInput" class="room-input" placeholder="Enter Room Code" maxlength="6">
                <button class="join-submit-btn" id="joinSubmitBtn">Join</button>
                <button class="back-btn" id="backFromJoinBtn">Back</button>
            </div>
        </div>

        <div id="game-screen" class="screen">
            <div class="game-container">
                <div class="mobile-ludo-shell" style="position: relative;">
                    <div class="top-hud">
                        <div class="hud-actions">
                            <button class="hud-icon-btn">☰</button>
                            <button class="hud-icon-btn">👥</button>
                            <button class="hud-icon-btn">WIN</button>
                            <button class="hud-icon-btn">◉</button>
                        </div>
                        <div class="tournament-badge">🏆 TOURNAMENT</div>
                    </div>

                    <!-- Player panels – now direct children of the positioned container -->
                    <div class="player-info" data-color="blue" id="playerBlue">
                        <div class="player-avatar-container">
                            <div class="player-avatar blue-avatar" id="avatarBlue">
                                <span class="avatar-icon">👤</span>
                                <div class="timer-overlay" id="timerBlue">30</div>
                            </div>
                            <button type="button" class="player-dice player-dice-small" id="diceBlue" aria-label="Blue dice">
                                <div class="dice-dots-small"></div>
                            </button>
                        </div>
                        <div class="player-name" id="nameBlue">Player 4</div>
                        <div class="player-rolls" id="rollsBlue"></div>
                    </div>

                    <div class="player-info" data-color="red" id="playerRed">
                        <div class="player-avatar-container">
                            <div class="player-avatar red-avatar" id="avatarRed">
                                <span class="avatar-icon">👤</span>
                                <div class="timer-overlay" id="timerRed">30</div>
                            </div>
                            <button type="button" class="player-dice player-dice-small" id="diceRed" aria-label="Red dice">
                                <div class="dice-dots-small"></div>
                            </button>
                        </div>
                        <div class="player-name" id="nameRed">You</div>
                        <div class="player-rolls" id="rollsRed"></div>
                    </div>

                    <div class="player-info" data-color="yellow" id="playerYellow">
                        <div class="player-avatar-container">
                            <div class="player-avatar yellow-avatar" id="avatarYellow">
                                <span class="avatar-icon">👤</span>
                                <div class="timer-overlay" id="timerYellow">30</div>
                            </div>
                            <button type="button" class="player-dice player-dice-small" id="diceYellow" aria-label="Yellow dice">
                                <div class="dice-dots-small"></div>
                            </button>
                        </div>
                        <div class="player-name" id="nameYellow">Player 3</div>
                        <div class="player-rolls" id="rollsYellow"></div>
                    </div>

                    <div class="player-info" data-color="green" id="playerGreen">
                        <div class="player-avatar-container">
                            <div class="player-avatar green-avatar" id="avatarGreen">
                                <span class="avatar-icon">👤</span>
                                <div class="timer-overlay" id="timerGreen">30</div>
                            </div>
                            <button type="button" class="player-dice player-dice-small" id="diceGreen" aria-label="Green dice">
                                <div class="dice-dots-small"></div>
                            </button>
                        </div>
                        <div class="player-name" id="nameGreen">Player 2</div>
                        <div class="player-rolls" id="rollsGreen"></div>
                    </div>

                    <div class="board-wrapper">
                        <canvas id="gameCanvas" width="2400" height="2400"></canvas>
                    </div>

                    <div class="bottom-shortcuts bottom-shortcuts-alone">
                        <button class="shortcut-btn">EMOJI</button>
                        <button class="shortcut-btn">CHAT</button>
                    </div>

                    <button class="exit-game-btn-new" id="exitGameBtn">✕</button>

                    <div id="debugPanel" class="debug-panel" aria-label="Debug panel">
                        <div class="debug-title">Debug</div>
                        <div class="debug-row">
                            <label for="debugTurnSelect">Turn</label>
                            <select id="debugTurnSelect">
                                <option value="red">red</option>
                                <option value="green">green</option>
                                <option value="yellow">yellow</option>
                                <option value="blue">blue</option>
                            </select>
                            <button id="debugForceTurnBtn" type="button">Force turn</button>
                        </div>
                        <div class="debug-row">
                            <label for="debugRollSelect">Roll</label>
                            <select id="debugRollSelect">
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                                <option value="5">5</option>
                                <option value="6" selected>6</option>
                            </select>
                            <button id="debugForceRollBtn" type="button">Force roll</button>
                        </div>
                        <div class="debug-row">
                            <button id="debugMoveFirstBtn" type="button">Move first movable</button>
                            <button id="debugResetBtn" type="button">Reset game</button>
                        </div>
                        <pre id="debugStatus" class="debug-status"></pre>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="moveChoicePopup" class="move-choice-popup">
        <div class="move-choice-buttons-inline" id="moveChoiceButtons"></div>
    </div>

    <script src="entropyRandom.js?v=9"></script>
    <script src="game.js?v=9"></script>
    <script src="auto_test.js"></script>
</body>
</html>
