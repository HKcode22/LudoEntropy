<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Stars Clone</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <div id="menu-screen" class="screen active">
            <div class="menu-container">
                <h1 class="game-title">LUDO</h1>
                <div class="menu-buttons">
                    <button class="menu-btn quick-play-btn" id="quickPlayBtn">
                        <span class="btn-icon">⚡</span>
                        <span class="btn-text">Quick Play</span>
                    </button>
                    <button class="menu-btn create-btn" id="createGameBtn">
                        <span class="btn-icon">+</span>
                        <span class="btn-text">Create Game</span>
                    </button>
                    <button class="menu-btn join-btn" id="joinGameBtn">
                        <span class="btn-icon">→</span>
                        <span class="btn-text">Join Game</span>
                    </button>
                </div>
            </div>
        </div>

        <div id="lobby-screen" class="screen">
            <div class="lobby-container">
                <h2 class="lobby-title">Game Lobby</h2>
                <div class="room-code-display">
                    <span class="room-label">Room Code:</span>
                    <span class="room-code" id="roomCode"></span>
                    <button class="copy-btn" id="copyCodeBtn">Copy</button>
                </div>
                <div class="players-grid">
                    <div class="player-slot" data-color="red">
                        <div class="player-avatar red-avatar"></div>
                        <div class="player-status">Waiting...</div>
                    </div>
                    <div class="player-slot" data-color="green">
                        <div class="player-avatar green-avatar"></div>
                        <div class="player-status">Waiting...</div>
                    </div>
                    <div class="player-slot" data-color="yellow">
                        <div class="player-avatar yellow-avatar"></div>
                        <div class="player-status">Waiting...</div>
                    </div>
                    <div class="player-slot" data-color="blue">
                        <div class="player-avatar blue-avatar"></div>
                        <div class="player-status">Waiting...</div>
                    </div>
                </div>
                <button class="start-game-btn" id="startGameBtn" disabled>Start Game</button>
                <button class="back-btn" id="backToMenuBtn">Back to Menu</button>
            </div>
        </div>

        <div id="join-screen" class="screen">
            <div class="join-container">
                <h2 class="join-title">Join Game</h2>
                <input type="text" id="roomCodeInput" class="room-input" placeholder="Enter Room Code" maxlength="6">
                <button class="join-submit-btn" id="joinSubmitBtn">Join</button>
                <button class="back-btn" id="backFromJoinBtn">Back</button>
            </div>
        </div>

        <div id="game-screen" class="screen">
            <div class="game-container">
                <div class="game-layout">
                    <!-- Top Left Player (Red) -->
                    <div class="player-info player-top-left" data-color="red">
                        <div class="player-avatar-container">
                            <div class="player-avatar red-avatar">
                                <span class="avatar-icon">👤</span>
                            </div>
                            <div class="player-dice" id="diceRed">
                                <div class="dice-dots-small"></div>
                            </div>
                        </div>
                        <div class="player-name" id="nameRed">Player 3</div>
                    </div>

                    <!-- Top Right Player (Green) -->
                    <div class="player-info player-top-right" data-color="green">
                        <div class="player-avatar-container">
                            <div class="player-avatar green-avatar">
                                <span class="avatar-icon">👤</span>
                            </div>
                            <div class="player-dice" id="diceGreen">
                                <div class="dice-dots-small"></div>
                            </div>
                        </div>
                        <div class="player-name" id="nameGreen">Player 4</div>
                    </div>

                    <!-- Game Board -->
                    <div class="board-wrapper">
                        <canvas id="gameCanvas" width="700" height="700"></canvas>
                    </div>

                    <!-- Bottom Left Player (Yellow - You) -->
                    <div class="player-info player-bottom-left" data-color="yellow">
                        <div class="player-avatar-container">
                            <div class="player-avatar yellow-avatar">
                                <span class="avatar-icon">👤</span>
                            </div>
                            <div class="player-dice" id="diceYellow">
                                <div class="dice-dots-small"></div>
                            </div>
                        </div>
                        <div class="player-name" id="nameYellow">You</div>
                    </div>

                    <!-- Bottom Right Player (Blue) -->
                    <div class="player-info player-bottom-right" data-color="blue">
                        <div class="player-avatar-container">
                            <div class="player-avatar blue-avatar">
                                <span class="avatar-icon">👤</span>
                            </div>
                            <div class="player-dice" id="diceBlue">
                                <div class="dice-dots-small"></div>
                            </div>
                        </div>
                        <div class="player-name" id="nameBlue">Player 2</div>
                    </div>

                    <!-- Exit Button -->
                    <button class="exit-game-btn-new" id="exitGameBtn">✕</button>
                </div>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
