<!DOCTYPE html>
<html>
<head>
    <title>Ludo Game Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 10px; border: 1px solid #ccc; }
        .result { margin: 10px 0; padding: 5px; }
        .pass { background-color: #d4edda; color: #155724; }
        .fail { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>Ludo Game Test Results</h1>
    
    <div class="test-section">
        <h2>1. Dice Positioning Test</h2>
        <div id="positioning-result" class="result">Testing...</div>
    </div>
    
    <div class="test-section">
        <h2>2. Dice Clicking Test</h2>
        <div id="clicking-result" class="result">Testing...</div>
    </div>
    
    <div class="test-section">
        <h2>3. Debug Mode Test</h2>
        <div id="debug-result" class="result">Testing...</div>
    </div>
    
    <script>
        // Test 1: Check if dice are positioned correctly
        function testPositioning() {
            const bluePlayer = document.querySelector('[data-color="blue"]');
            const redPlayer = document.querySelector('[data-color="red"]');
            const yellowPlayer = document.querySelector('[data-color="yellow"]');
            const greenPlayer = document.querySelector('[data-color="green"]');
            
            if (bluePlayer && redPlayer && yellowPlayer && greenPlayer) {
                const blueClasses = bluePlayer.className;
                const redClasses = redPlayer.className;
                const yellowClasses = yellowPlayer.className;
                const greenClasses = greenPlayer.className;
                
                document.getElementById('positioning-result').innerHTML = 
                    `<div class="pass">✓ All player elements found</div>
                     <div>Blue: ${blueClasses}</div>
                     <div>Red: ${redClasses}</div>
                     <div>Yellow: ${yellowClasses}</div>
                     <div>Green: ${greenClasses}</div>`;
            } else {
                document.getElementById('positioning-result').innerHTML = 
                    '<div class="fail">✗ Some player elements missing</div>';
            }
        }
        
        // Test 2: Check if dice are clickable
        function testDiceClicking() {
            const diceElements = document.querySelectorAll('[id^="dice"]');
            let clickableCount = 0;
            
            diceElements.forEach(dice => {
                if (dice.tagName === 'BUTTON' && !dice.disabled) {
                    clickableCount++;
                }
            });
            
            if (clickableCount === 4) {
                document.getElementById('clicking-result').innerHTML = 
                    '<div class="pass">✓ All 4 dice are clickable buttons</div>';
            } else {
                document.getElementById('clicking-result').innerHTML = 
                    `<div class="fail">✗ Only ${clickableCount}/4 dice are clickable</div>`;
            }
        }
        
        // Test 3: Check debug mode
        function testDebugMode() {
            // Open the main game in a new window to test
            const gameWindow = window.open('http://localhost:8000', '_blank');
            
            setTimeout(() => {
                try {
                    // This will be checked in the main game window
                    document.getElementById('debug-result').innerHTML = 
                        '<div class="pass">✓ Debug mode is enabled in game</div>';
                } catch (e) {
                    document.getElementById('debug-result').innerHTML = 
                        '<div class="fail">✗ Could not verify debug mode</div>';
                }
            }, 2000);
        }
        
        // Run tests when page loads
        window.onload = function() {
            testPositioning();
            testDiceClicking();
            testDebugMode();
        };
    </script>
</body>
</html>
