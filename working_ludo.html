<!DOCTYPE html>
<html>
<head>
    <title>Ludo Game - Working Version</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #4b234c;
            font-family: Arial, sans-serif;
        }
        
        .game-container {
            width: 500px;
            height: 600px;
            margin: 0 auto;
            position: relative;
        }
        
        .top-players {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 80px;
            display: flex;
            justify-content: space-between;
            padding: 10px;
        }
        
        .board {
            position: absolute;
            top: 80px;
            left: 0;
            right: 0;
            height: 400px;
            background: white;
            border: 2px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        
        .bottom-players {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 80px;
            display: flex;
            justify-content: space-between;
            padding: 10px;
        }
        
        .player {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .player:hover {
            transform: scale(1.1);
        }
        
        .red { background: linear-gradient(135deg, #ff6b6b, #c92a2a); }
        .blue { background: linear-gradient(135deg, #74c0fc, #1864ab); }
        .green { background: linear-gradient(135deg, #51cf66, #2b8a3e); }
        .yellow { background: linear-gradient(135deg, #ffd43b, #fab005); }
        
        .dice {
            width: 25px;
            height: 25px;
            background: rgba(255,255,255,0.9);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            margin-top: 5px;
        }
        
        .name {
            font-size: 10px;
            margin-bottom: 2px;
        }
        
        .controls {
            text-align: center;
            margin: 20px 0;
        }
        
        .color-selector {
            margin: 10px 0;
        }
        
        button {
            background: #2587D9;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        
        button:hover {
            background: #1864ab;
        }
    </style>
</head>
<body>
    <div class="controls">
        <h3 style="color: white;">Choose Your Color:</h3>
        <div class="color-selector">
            <button onclick="setMyColor('red')">Red</button>
            <button onclick="setMyColor('blue')">Blue</button>
            <button onclick="setMyColor('green')">Green</button>
            <button onclick="setMyColor('yellow')">Yellow</button>
        </div>
        <button onclick="testDice()">Test All Dice</button>
        <button onclick="rollDice('red')">Roll Red</button>
        <button onclick="rollDice('blue')">Roll Blue</button>
        <button onclick="rollDice('green')">Roll Green</button>
        <button onclick="rollDice('yellow')">Roll Yellow</button>
    </div>
    
    <div class="game-container">
        <div class="top-players">
            <div class="player red" id="red-player">
                <div class="name">Red</div>
                <div class="dice" id="red-dice">🎲</div>
            </div>
            <div class="player blue" id="blue-player">
                <div class="name">Blue</div>
                <div class="dice" id="blue-dice">🎲</div>
            </div>
        </div>
        
        <div class="board">
            <div id="board-text">LUDO BOARD</div>
        </div>
        
        <div class="bottom-players">
            <div class="player yellow" id="yellow-player">
                <div class="name">Yellow</div>
                <div class="dice" id="yellow-dice">🎲</div>
            </div>
            <div class="player green" id="green-player">
                <div class="name">Green</div>
                <div class="dice" id="green-dice">🎲</div>
            </div>
        </div>
    </div>
    
    <script>
        let myColor = null;
        const positions = {
            red: { top: 'blue', right: 'green', bottom: 'yellow', left: 'red' },
            blue: { top: 'red', right: 'yellow', bottom: 'green', left: 'blue' },
            green: { top: 'yellow', right: 'red', bottom: 'blue', left: 'green' },
            yellow: { top: 'green', right: 'blue', bottom: 'red', left: 'yellow' }
        };
        
        function setMyColor(color) {
            myColor = color;
            updatePositions();
            document.getElementById('board-text').textContent = `You are ${color.toUpperCase()}`;
            console.log(`🎮 My color set to: ${color}`);
        }
        
        function updatePositions() {
            if (!myColor) return;
            
            const pos = positions[myColor];
            const players = {
                top: [document.getElementById(pos.top + '-player')],
                bottom: [document.getElementById(pos.bottom + '-player')]
            };
            
            // Clear current positions
            document.querySelectorAll('.player').forEach(p => {
                p.style.position = 'static';
            });
            
            // Update top players
            const topContainer = document.querySelector('.top-players');
            topContainer.innerHTML = '';
            if (pos.left !== pos.top) {
                topContainer.appendChild(document.getElementById(pos.left + '-player'));
            }
            topContainer.appendChild(document.getElementById(pos.top + '-player'));
            if (pos.right !== pos.top && pos.right !== pos.left) {
                topContainer.appendChild(document.getElementById(pos.right + '-player'));
            }
            
            // Update bottom players
            const bottomContainer = document.querySelector('.bottom-players');
            bottomContainer.innerHTML = '';
            const remainingColor = pos.bottom;
            bottomContainer.appendChild(document.getElementById(remainingColor + '-player'));
            
            console.log(`🎯 Positions updated for ${myColor}:`, pos);
        }
        
        function rollDice(color) {
            const value = Math.floor(Math.random() * 6) + 1;
            const dice = document.getElementById(color + '-dice');
            dice.textContent = value;
            dice.style.animation = 'none';
            setTimeout(() => {
                dice.style.animation = 'spin 0.5s ease-in-out';
            }, 10);
            console.log(`🎲 ${color} rolled: ${value}`);
        }
        
        function testDice() {
            ['red', 'blue', 'green', 'yellow'].forEach(color => {
                rollDice(color);
            });
        }
        
        // Add spin animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes spin {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
            }
        `;
        document.head.appendChild(style);
        
        // Auto-test on load
        setTimeout(() => {
            console.log('🧪 Auto-testing dice functionality...');
            testDice();
        }, 1000);
    </script>
</body>
</html>
